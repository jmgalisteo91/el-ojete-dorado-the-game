<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado oscuro estilo insignia RPG -->
  <rect width="64" height="64" rx="16" fill="#0b0e17"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Halo de resplandor áureo -->
  <circle cx="32" cy="32" r="22" fill="#d97706" opacity="0.18"/>

  <!-- Rayos solares / espigas sagradas de la reliquia -->
  <path d="M32 4 L34 10 L30 10 Z" fill="#ffd700"/>
  <path d="M32 60 L34 54 L30 54 Z" fill="#ffd700"/>
  <path d="M4 32 L10 34 L10 30 Z" fill="#ffd700"/>
  <path d="M60 32 L54 34 L54 30 Z" fill="#ffd700"/>

  <path d="M12 12 L18 15 L15 18 Z" fill="#f59e0b"/>
  <path d="M52 12 L46 15 L49 18 Z" fill="#f59e0b"/>
  <path d="M12 52 L18 49 L15 46 Z" fill="#f59e0b"/>
  <path d="M52 52 L46 49 L49 46 Z" fill="#f59e0b"/>

  <!-- Anillo exterior del Ojete Dorado -->
  <circle cx="32" cy="32" r="18" fill="url(#ringGrad)" stroke="#fef08a" stroke-width="1.5"/>

  <!-- Joyas ornamentales incrustadas en el anillo -->
  <circle cx="32" cy="16" r="1.8" fill="#ffffff"/>
  <circle cx="32" cy="48" r="1.8" fill="#ffffff"/>
  <circle cx="16" cy="32" r="1.8" fill="#ffffff"/>
  <circle cx="48" cy="32" r="1.8" fill="#ffffff"/>

  <!-- Bisel interior oscuro y corona dorada -->
  <circle cx="32" cy="32" r="13.5" fill="#180e29"/>
  <circle cx="32" cy="32" r="12" fill="url(#goldGlow)"/>

  <!-- Núcleo celestial de la reliquia ("El Ojete") -->
  <ellipse cx="32" cy="32" rx="6.5" ry="8" fill="url(#coreGlow)"/>
  <ellipse cx="32" cy="32" rx="3" ry="5.5" fill="#080614"/>

  <!-- Destello especular dentro de la pupila -->
  <circle cx="30.5" cy="29.5" r="1.8" fill="#ffffff"/>
  <circle cx="34" cy="34" r="0.8" fill="#a5f3fc"/>

  <!-- Destello cósmico ✦ en esquina superior -->
  <path d="M47 8 Q47 13 52 13 Q47 13 47 18 Q47 13 42 13 Q47 13 47 8 Z" fill="#ffffff"/>
</svg>

